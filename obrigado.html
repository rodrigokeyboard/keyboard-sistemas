<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada | Keyboard Sistemas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primaria: #0047AB;
            --primaria-escura: #003380;
            --branca: #ffffff;
            --fundo-leve: #f8fafc;
            --texto-principal: #1e293b;
            --texto-secundario: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--fundo-leve); color: var(--texto-principal); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .card-obrigado { background: var(--branca); padding: 50px 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        .icon { font-size: 4rem; color: #22c55e; margin-bottom: 20px; }
        h1 { color: var(--primaria); margin-bottom: 15px; font-size: 2rem; }
        p { color: var(--texto-secundario); margin-bottom: 30px; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 30px; background-color: var(--primaria); color: var(--branca); border-radius: 50px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn:hover { background-color: var(--primaria-escura); }
    </style>
</head>
<body>

    <div class="card-obrigado">
        <div class="icon">✓</div>
        <h1>Obrigado pelo contato!</h1>
        <p>Recebemos suas informações com sucesso. Nossa equipe da <strong>Keyboard Sistemas</strong> analisará a sua solicitação e entrará em contato em breve pelo WhatsApp ou e-mail.</p>
        <a href="index.html" class="btn">Voltar para o Site</a>
    </div>

</body>
</html>
